<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Charadise World Painter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #dff4ff;
    }

    #world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #dff4ff;
      touch-action: none;
      cursor: crosshair;
    }

    /*
     * 2048×2048の各ファイル。
     * 画面上ではCSSで縮小表示する。
     */
    .tile {
      position: absolute;
      width: 2048px;
      height: 2048px;
      image-rendering: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /*
     * ------------------------------------------------------------
     * 上部UI
     * ------------------------------------------------------------
     */

    #topbar {
      position: fixed;
      z-index: 10000;

      top: 12px;
      left: 12px;
      right: 12px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 10px;

      background: rgba(255, 255, 255, 0.94);
      border-radius: 16px;

      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.14);

      overflow-x: auto;
      white-space: nowrap;
    }

    #topbar button {
      border: 0;
      border-radius: 10px;

      padding: 9px 12px;

      background: #f1f1f1;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
      flex: 0 0 auto;
    }

    #topbar button:hover {
      background: #e5e5e5;
    }

    #topbar button.active {
      background: #222;
      color: white;
    }

    .separator {
      width: 1px;
      height: 30px;
      background: #ddd;
      flex: 0 0 auto;
    }

    /*
     * カラーピッカー
     */

    #colorPicker {
      width: 44px;
      height: 38px;

      padding: 2px;

      border: 0;
      border-radius: 9px;

      background: transparent;

      cursor: pointer;
    }

    #colorText {
      width: 82px;

      border: 1px solid #ddd;
      border-radius: 9px;

      padding: 8px;

      font-family: monospace;
      font-size: 13px;
    }

    /*
     * ブラシサイズ
     */

    #brushSize {
      width: 110px;
    }

    #sizeText {
      min-width: 45px;
      text-align: center;

      font-size: 12px;
      font-weight: 700;
    }

    /*
     * ------------------------------------------------------------
     * 座標表示
     * ------------------------------------------------------------
     */

    #coordinates {
      position: fixed;
      z-index: 10000;

      left: 14px;
      bottom: 14px;

      padding: 9px 13px;

      background: rgba(255, 255, 255, 0.92);
      border-radius: 11px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.12);

      font-family: monospace;
      font-size: 13px;
      font-weight: 700;

      pointer-events: none;
      user-select: none;
    }

    /*
     * ------------------------------------------------------------
     * タイル情報
     * ------------------------------------------------------------
     */

    #tileInfo {
      position: fixed;
      z-index: 10000;

      right: 14px;
      bottom: 14px;

      padding: 9px 13px;

      background: rgba(255, 255, 255, 0.92);
      border-radius: 11px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.12);

      font-size: 12px;
      font-weight: 700;

      pointer-events: none;
      user-select: none;
    }

    /*
     * ------------------------------------------------------------
     * ダウンロードメニュー
     * ------------------------------------------------------------
     */

    #downloadPanel {
      position: fixed;
      z-index: 10001;

      top: 78px;
      right: 14px;

      display: none;

      width: 260px;

      padding: 16px;

      background: rgba(255, 255, 255, 0.97);
      border-radius: 15px;

      box-shadow:
        0 8px 35px rgba(0, 0, 0, 0.18);
    }

    #downloadPanel.open {
      display: block;
    }

    #downloadPanel h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #downloadPanel p {
      margin: 6px 0 12px;
      font-size: 12px;
      line-height: 1.5;
      opacity: 0.7;
    }

    #downloadTile {
      width: 100%;

      border: 0;
      border-radius: 10px;

      padding: 11px;

      background: #222;
      color: white;

      font-weight: 700;
      cursor: pointer;
    }

    /*
     * ------------------------------------------------------------
     * 地面ペイントプリセット
     * ------------------------------------------------------------
     */

    #presets {
      display: flex;
      gap: 5px;
      flex: 0 0 auto;
    }

    .preset {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      padding: 7px 9px !important;

      font-size: 11px !important;
    }

    .presetColor {
      width: 15px;
      height: 15px;

      border-radius: 50%;

      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    /*
     * ------------------------------------------------------------
     * スマートフォン
     * ------------------------------------------------------------
     */

    @media (max-width: 700px) {
      #topbar {
        top: 8px;
        left: 8px;
        right: 8px;
      }

      #coordinates {
        left: 8px;
        bottom: 8px;
      }

      #tileInfo {
        right: 8px;
        bottom: 8px;
      }

      #downloadPanel {
        top: 70px;
        right: 8px;
        width: calc(100vw - 16px);
      }
    }
  </style>
</head>

<body>

  <!-- ============================================================
       無限ペイント世界
       ============================================================ -->

  <div id="world"></div>


  <!-- ============================================================
       ツールバー
       ============================================================ -->

  <div id="topbar">

    <button
      id="paintTool"
      class="active"
      type="button"
    >
      🖌 ペイント
    </button>

    <button
      id="eyedropperTool"
      type="button"
    >
      💧 スポイト
    </button>

    <div class="separator"></div>

    <div id="presets">

      <button class="preset" data-color="#3f9b4b">
        <span
          class="presetColor"
          style="background:#3f9b4b"
        ></span>
        緑地
      </button>

      <button class="preset" data-color="#4ca7d8">
        <span
          class="presetColor"
          style="background:#4ca7d8"
        ></span>
        海
      </button>

      <button class="preset" data-color="#d8bd68">
        <span
          class="presetColor"
          style="background:#d8bd68"
        ></span>
        砂漠
      </button>

      <button class="preset" data-color="#8b806e">
        <span
          class="presetColor"
          style="background:#8b806e"
        ></span>
        荒野
      </button>

      <button class="preset" data-color="#c94a2c">
        <span
          class="presetColor"
          style="background:#c94a2c"
        ></span>
        焔地
      </button>

      <button class="preset" data-color="#a9d9e8">
        <span
          class="presetColor"
          style="background:#a9d9e8"
        ></span>
        氷地
      </button>

      <button class="preset" data-color="#82c96b">
        <span
          class="presetColor"
          style="background:#82c96b"
        ></span>
        エデン
      </button>

      <button class="preset" data-color="#f4f7fa">
        <span
          class="presetColor"
          style="background:#f4f7fa"
        ></span>
        雪原
      </button>

    </div>

    <div class="separator"></div>

    <input
      id="colorPicker"
      type="color"
      value="#3f9b4b"
      title="カラーピッカー"
    >

    <input
      id="colorText"
      type="text"
      value="#3f9b4b"
      maxlength="7"
      title="カラーコード"
    >

    <div class="separator"></div>

    <span id="sizeText">30px</span>

    <input
      id="brushSize"
      type="range"
      min="1"
      max="300"
      value="30"
    >

    <div class="separator"></div>

    <button
      id="clearTile"
      type="button"
    >
      🗑 このタイルを消去
    </button>

    <button
      id="downloadButton"
      type="button"
    >
      💾 2048×2048
    </button>

  </div>


  <!-- ============================================================
       座標
       ============================================================ -->

  <div id="coordinates">
    X: 0 &nbsp; Y: 0
  </div>

  <div id="tileInfo">
    Tile X: 0 &nbsp; Y: 0
  </div>


  <!-- ============================================================
       ダウンロードパネル
       ============================================================ -->

  <div id="downloadPanel">

    <h3>2048×2048 地図ファイル</h3>

    <p>
      現在いる2048×2048タイルをPNGとして保存します。<br>
      タイル座標もファイル名に入ります。
    </p>

    <button
      id="downloadTile"
      type="button"
    >
      この場所をPNGとしてダウンロード
    </button>

  </div>


  <script>

    /*
     * ============================================================
     * Charadise World Painter
     * ============================================================
     *
     * 世界全体：
     *
     *                    Infinity
     *
     *       ← ← ← ← ← ← ← → → → → → → →
     *
     *                    ↑
     *                    │
     *                  Infinity
     *                    │
     *                    ↓
     *
     * 1タイル：
     *
     *             2048 × 2048
     *
     * タイル座標：
     *
     *     (...,-2) (...,-1) (...,0) (...,1) (...,2) ...
     *
     * 各タイルは独立したCanvas。
     *
     * ============================================================
     */


    /*
     * ============================================================
     * 設定
     * ============================================================
     */

    const TILE_SIZE = 2048;

    /*
     * 画面上での表示倍率。
     *
     * 1 = 実寸だと巨大なので、
     * 画面では縮小して表示する。
     */
    const VIEW_SCALE = 0.5;


    /*
     * ============================================================
     * DOM
     * ============================================================
     */

    const world =
      document.getElementById("world");

    const coordinates =
      document.getElementById("coordinates");

    const tileInfo =
      document.getElementById("tileInfo");

    const colorPicker =
      document.getElementById("colorPicker");

    const colorText =
      document.getElementById("colorText");

    const brushSize =
      document.getElementById("brushSize");

    const sizeText =
      document.getElementById("sizeText");

    const paintTool =
      document.getElementById("paintTool");

    const eyedropperTool =
      document.getElementById("eyedropperTool");

    const downloadButton =
      document.getElementById("downloadButton");

    const downloadPanel =
      document.getElementById("downloadPanel");

    const downloadTileButton =
      document.getElementById("downloadTile");

    const clearTileButton =
      document.getElementById("clearTile");


    /*
     * ============================================================
     * 色
     * ============================================================
     */

    let currentColor = "#3f9b4b";


    function setColor(color) {

      if (!/^#[0-9a-fA-F]{6}$/.test(color)) {
        return;
      }

      currentColor =
        color.toLowerCase();

      colorPicker.value =
        currentColor;

      colorText.value =
        currentColor;
    }


    colorPicker.addEventListener(
      "input",
      function() {

        setColor(
          colorPicker.value
        );

      }
    );


    colorText.addEventListener(
      "change",
      function() {

        let value =
          colorText.value.trim();

        if (
          /^[0-9a-fA-F]{6}$/.test(value)
        ) {
          value = "#" + value;
        }

        if (
          /^#[0-9a-fA-F]{6}$/.test(value)
        ) {
          setColor(value);
        } else {
          colorText.value =
            currentColor;
        }

      }
    );


    /*
     * プリセット
     */

    document
      .querySelectorAll(".preset")
      .forEach(function(button) {

        button.addEventListener(
          "click",
          function() {

            setColor(
              button.dataset.color
            );

            setTool("paint");

          }
        );

      });


    /*
     * ============================================================
     * ブラシ
     * ============================================================
     */

    let brushRadius =
      Number(brushSize.value) / 2;


    brushSize.addEventListener(
      "input",
      function() {

        brushRadius =
          Number(brushSize.value) / 2;

        sizeText.textContent =
          brushSize.value + "px";

      }
    );


    /*
     * ============================================================
     * ツール
     * ============================================================
     */

    let currentTool = "paint";


    function setTool(tool) {

      currentTool = tool;

      paintTool.classList.toggle(
        "active",
        tool === "paint"
      );

      eyedropperTool.classList.toggle(
        "active",
        tool === "eyedropper"
      );

      if (tool === "paint") {
        world.style.cursor = "crosshair";
      } else {
        world.style.cursor = "copy";
      }

    }


    paintTool.addEventListener(
      "click",
      function() {
        setTool("paint");
      }
    );


    eyedropperTool.addEventListener(
      "click",
      function() {
        setTool("eyedropper");
      }
    );


    /*
     * ============================================================
     * 無限座標
     * ============================================================
     *
     * ワールドの左上を
     * 0,0 とする。
     *
     * 画面をドラッグしても、
     * 座標は無限に続く。
     *
     * タイル：
     *
     * X = floor(worldX / 2048)
     * Y = floor(worldY / 2048)
     */


    let cameraX = 0;
    let cameraY = 0;


    /*
     * 中央を世界座標0,0にする。
     */

    function screenToWorld(
      screenX,
      screenY
    ) {

      return {
        x:
          (
            screenX -
            window.innerWidth / 2 -
            cameraX
          ) / VIEW_SCALE,

        y:
          (
            screenY -
            window.innerHeight / 2 -
            cameraY
          ) / VIEW_SCALE
      };

    }


    /*
     * ============================================================
     * タイルデータ
     * ============================================================
     *
     * Map:
     *
     * "x,y" => Canvas
     *
     * 必要になったタイルだけ生成する。
     */

    const tiles =
      new Map();


    function tileKey(tx, ty) {
      return tx + "," + ty;
    }


    function createTile(tx, ty) {

      const key =
        tileKey(tx, ty);

      if (tiles.has(key)) {
        return tiles.get(key);
      }


      /*
       * 2048×2048 Canvas
       */

      const canvas =
        document.createElement("canvas");

      canvas.width =
        TILE_SIZE;

      canvas.height =
        TILE_SIZE;

      canvas.className =
        "tile";


      /*
       * Canvasの初期背景。
       *
       * 透明にしておく。
       * 透明部分は海など、
       * 必要な色で塗ることができる。
       */

      const ctx =
        canvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );


      /*
       * Canvas情報
       */

      const tile = {
        tx: tx,
        ty: ty,
        canvas: canvas,
        ctx: ctx,
        dirty: false
      };


      tiles.set(
        key,
        tile
      );

      world.appendChild(
        canvas
      );

      return tile;
    }


    /*
     * ============================================================
     * タイル表示位置
     * ============================================================
     */

    function updateTiles() {

      /*
       * 画面内に必要なタイルだけ作る。
       *
       * 周辺に少し余裕を持たせる。
       */

      const halfW =
        window.innerWidth /
        VIEW_SCALE /
        2;

      const halfH =
        window.innerHeight /
        VIEW_SCALE /
        2;


      const minX =
        Math.floor(
          (
            -cameraX / VIEW_SCALE -
            halfW
          ) / TILE_SIZE
        ) - 1;


      const maxX =
        Math.floor(
          (
            -cameraX / VIEW_SCALE +
            halfW
          ) / TILE_SIZE
        ) + 1;


      const minY =
        Math.floor(
          (
            -cameraY / VIEW_SCALE -
            halfH
          ) / TILE_SIZE
        ) - 1;


      const maxY =
        Math.floor(
          (
            -cameraY / VIEW_SCALE +
            halfH
          ) / TILE_SIZE
        ) + 1;


      for (
        let ty = minY;
        ty <= maxY;
        ty++
      ) {

        for (
          let tx = minX;
          tx <= maxX;
          tx++
        ) {

          createTile(tx, ty);

        }

      }


      /*
       * 位置更新
       */

      tiles.forEach(function(tile) {

        const x =
          window.innerWidth / 2 +
          cameraX +
          tile.tx *
          TILE_SIZE *
          VIEW_SCALE;


        const y =
          window.innerHeight / 2 +
          cameraY +
          tile.ty *
          TILE_SIZE *
          VIEW_SCALE;


        tile.canvas.style.transform =
          "translate(" +
          x +
          "px," +
          y +
          "px) scale(" +
          VIEW_SCALE +
          ")";

      });

    }


    /*
     * ============================================================
     * 座標表示
     * ============================================================
     */

    function updateCoordinates(
      worldX,
      worldY
    ) {

      const x =
        Math.floor(worldX);

      const y =
        Math.floor(worldY);

      const tx =
        Math.floor(
          worldX / TILE_SIZE
        );

      const ty =
        Math.floor(
          worldY / TILE_SIZE
        );

      coordinates.textContent =
        "X: " +
        x +
        "   Y: " +
        y;

      tileInfo.textContent =
        "Tile X: " +
        tx +
        "   Y: " +
        ty;

    }


    /*
     * ============================================================
     * ペイント
     * ============================================================
     */

    function paintAt(
      worldX,
      worldY
    ) {

      const tx =
        Math.floor(
          worldX / TILE_SIZE
        );

      const ty =
        Math.floor(
          worldY / TILE_SIZE
        );


      const localX =
        worldX -
        tx * TILE_SIZE;

      const localY =
        worldY -
        ty * TILE_SIZE;


      const tile =
        createTile(tx, ty);


      const ctx =
        tile.ctx;


      /*
       * 円形ブラシ
       */

      ctx.save();

      ctx.fillStyle =
        currentColor;

      ctx.beginPath();

      ctx.arc(
        localX,
        localY,
        brushRadius,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.restore();


      tile.dirty = true;

    }


    /*
     * ============================================================
     * スポイト
     * ============================================================
     *
     * タップした場所の2048×2048 Canvasから
     * 実際のピクセル色を取得する。
     */

    function pickColor(
      worldX,
      worldY
    ) {

      const tx =
        Math.floor(
          worldX / TILE_SIZE
        );

      const ty =
        Math.floor(
          worldY / TILE_SIZE
        );


      const localX =
        Math.floor(
          worldX -
          tx * TILE_SIZE
        );

      const localY =
        Math.floor(
          worldY -
          ty * TILE_SIZE
        );


      const tile =
        tiles.get(
          tileKey(tx, ty)
        );


      if (!tile) {
        return;
      }


      const pixel =
        tile.ctx.getImageData(
          localX,
          localY,
          1,
          1
        ).data;


      /*
       * 透明なら白として扱う。
       */

      let r = pixel[0];
      let g = pixel[1];
      let b = pixel[2];


      if (pixel[3] === 0) {
        r = 255;
        g = 255;
        b = 255;
      }


      const hex =
        "#" +
        [r, g, b]
          .map(function(value) {
            return value
              .toString(16)
              .padStart(2, "0");
          })
          .join("");


      setColor(hex);

      setTool("paint");

    }


    /*
     * ============================================================
     * ポインター操作
     * ============================================================
     *
     * PC：
     *     マウスドラッグ
     *
     * スマートフォン：
     *     タッチドラッグ
     *
     * ペイント：
     *     短いタッチ/クリックで描画
     *
     * スポイト：
     *     タップした地点の色を取得
     *
     * 長くドラッグ：
     *     世界を移動
     */


    let pointerDown = false;

    let drawing = false;

    let moved = false;

    let startPointerX = 0;
    let startPointerY = 0;

    let lastPointerX = 0;
    let lastPointerY = 0;

    let startWorldX = 0;
    let startWorldY = 0;


    world.addEventListener(
      "pointerdown",
      function(event) {

        /*
         * 左クリックとタッチだけ。
         */

        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {
          return;
        }


        event.preventDefault();


        pointerDown = true;
        drawing = false;
        moved = false;


        startPointerX =
          event.clientX;

        startPointerY =
          event.clientY;


        lastPointerX =
          event.clientX;

        lastPointerY =
          event.clientY;


        const p =
          screenToWorld(
            event.clientX,
            event.clientY
          );


        startWorldX = p.x;
        startWorldY = p.y;


        world.setPointerCapture(
          event.pointerId
        );


        /*
         * スポイトはタップした瞬間に取得。
         */

        if (
          currentTool === "eyedropper"
        ) {

          pickColor(
            p.x,
            p.y
          );

          pointerDown = false;

        }

      },
      {
        passive: false
      }
    );


    world.addEventListener(
      "pointermove",
      function(event) {

        if (!pointerDown) {

          const p =
            screenToWorld(
              event.clientX,
              event.clientY
            );

          updateCoordinates(
            p.x,
            p.y
          );

          return;
        }


        event.preventDefault();


        const dx =
          event.clientX -
          startPointerX;

        const dy =
          event.clientY -
          startPointerY;


        /*
         * 一定以上動いたら
         * 移動モード。
         */

        if (
          Math.abs(dx) > 4 ||
          Math.abs(dy) > 4
        ) {

          moved = true;

        }


        /*
         * 世界をドラッグ。
         */

        if (moved) {

          cameraX +=
            event.clientX -
            lastPointerX;

          cameraY +=
            event.clientY -
            lastPointerY;


          updateTiles();


          const p =
            screenToWorld(
              event.clientX,
              event.clientY
            );


          updateCoordinates(
            p.x,
            p.y
          );


          lastPointerX =
            event.clientX;

          lastPointerY =
            event.clientY;

          return;
        }


        /*
         * ペイント。
         *
         * マウス/タッチを少し動かしたとき、
         * 描画を続ける。
         */

        if (
          currentTool === "paint"
        ) {

          const p =
            screenToWorld(
              event.clientX,
              event.clientY
            );

          paintAt(
            p.x,
            p.y
          );

          drawing = true;

          updateCoordinates(
            p.x,
            p.y
          );

        }

      },
      {
        passive: false
      }
    );


    world.addEventListener(
      "pointerup",
      function(event) {

        if (!pointerDown) {
          return;
        }


        event.preventDefault();


        const p =
          screenToWorld(
            event.clientX,
            event.clientY
          );


        /*
         * 動かなかった場合は
         * 1回だけペイント。
         */

        if (
          !moved &&
          currentTool === "paint"
        ) {

          paintAt(
            p.x,
            p.y
          );

        }


        pointerDown = false;
        drawing = false;


        try {
          world.releasePointerCapture(
            event.pointerId
          );
        } catch (e) {
        }


        updateCoordinates(
          p.x,
          p.y
        );

      },
      {
        passive: false
      }
    );


    world.addEventListener(
      "pointercancel",
      function() {

        pointerDown = false;
        drawing = false;

      }
    );


    /*
     * ============================================================
     * リサイズ
     * ============================================================
     */

    window.addEventListener(
      "resize",
      function() {

        updateTiles();

      }
    );


    /*
     * ============================================================
     * この2048×2048タイルを消去
     * ============================================================
     */

    clearTileButton.addEventListener(
      "click",
      function() {

        /*
         * 現在画面中央の座標。
         */

        const center =
          screenToWorld(
            window.innerWidth / 2,
            window.innerHeight / 2
          );


        const tx =
          Math.floor(
            center.x / TILE_SIZE
          );

        const ty =
          Math.floor(
            center.y / TILE_SIZE
          );


        const tile =
          createTile(tx, ty);


        tile.ctx.clearRect(
          0,
          0,
          TILE_SIZE,
          TILE_SIZE
        );


        tile.dirty = true;

      }
    );


    /*
     * ============================================================
     * ダウンロードパネル
     * ============================================================
     */

    downloadButton.addEventListener(
      "click",
      function() {

        downloadPanel.classList.toggle(
          "open"
        );

      }
    );


    /*
     * ============================================================
     * 現在の2048×2048タイルをPNG化
     * ============================================================
     */

    downloadTileButton.addEventListener(
      "click",
      function() {

        /*
         * 画面中央のワールド座標。
         */

        const center =
          screenToWorld(
            window.innerWidth / 2,
            window.innerHeight / 2
          );


        const tx =
          Math.floor(
            center.x / TILE_SIZE
          );

        const ty =
          Math.floor(
            center.y / TILE_SIZE
          );


        const key =
          tileKey(tx, ty);


        let tile =
          tiles.get(key);


        /*
         * まだ描画していないタイルなら
         * 空の2048×2048 PNGを作る。
         */

        if (!tile) {
          tile =
            createTile(tx, ty);
        }


        /*
         * Canvas自体が2048×2048なので、
         * そのままPNGにする。
         */

        tile.canvas.toBlob(
          function(blob) {

            if (!blob) {
              alert(
                "PNGの作成に失敗しました。"
              );
              return;
            }


            const url =
              URL.createObjectURL(
                blob
              );


            const link =
              document.createElement("a");


            link.href = url;


            /*
             * ファイル名。
             *
             * 例：
             *
             * Charadise_X0_Y0.png
             * Charadise_X-1_Y2.png
             */

            link.download =
              "Charadise_X" +
              tx +
              "_Y" +
              ty +
              ".png";


            document.body.appendChild(
              link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
              url
            );

          },
          "image/png"
        );

      }
    );


    /*
     * ============================================================
     * 初期化
     * ============================================================
     */

    updateTiles();

    updateCoordinates(
      0,
      0
    );

    sizeText.textContent =
      brushSize.value + "px";


    /*
     * ============================================================
     * キーボードショートカット
     * ============================================================
     *
     * P = ペイント
     * I = スポイト
     * D = ダウンロード
     * ============================================================
     */

    document.addEventListener(
      "keydown",
      function(event) {

        /*
         * 入力欄にいるときは無視。
         */

        if (
          event.target.tagName === "INPUT"
        ) {
          return;
        }


        if (
          event.key.toLowerCase() === "p"
        ) {
          setTool("paint");
        }


        if (
          event.key.toLowerCase() === "i"
        ) {
          setTool("eyedropper");
        }


        if (
          event.key.toLowerCase() === "d"
        ) {
          downloadPanel.classList.add(
            "open"
          );
        }

      }
    );

  </script>

</body>
</html>
