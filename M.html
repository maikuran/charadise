<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>4000x2000 気候地図エディタ Pro</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }
        header {
            background: #34495e;
            padding: 10px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #1a252f;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2c3e50;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .palette {
            display: flex;
            gap: 4px;
            background: #2c3e50;
            padding: 5px 10px;
            border-radius: 4px;
            align-items: center;
        }
        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-dot.selected {
            border-color: #ffffff;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        label { font-size: 11px; font-weight: bold; color: #bdc3c7; }
        input[type="file"] { font-size: 11px; width: 130px; }
        button {
            padding: 6px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        button:hover { background: #2980b9; }
        button.active { background: #e67e22; }
        button.active:hover { background: #d35400; }
        
        /* モード切替ボタンの強調 */
        .mode-btn { background: #9b59b6; }
        .mode-btn:hover { background: #8e44ad; }
        
        #download-btn { background: #2ecc71; margin-left: auto; }
        #download-btn:hover { background: #27ae60; }
        
        .workspace {
            flex: 1;
            overflow: auto; /* 移動モード及び通常スクロール用 */
            position: relative;
            padding: 10px;
            background: #1a252f;
        }
        /* 移動モード時の見た目変更 */
        .workspace.mode-move {
            cursor: grab;
        }
        .workspace.mode-move:active {
            cursor: grabbing;
        }
        .workspace.mode-paint #editor-canvas {
            cursor: crosshair;
        }

        .canvas-container {
            position: relative;
            width: 4000px;
            height: 2000px;
            background: #2c3e50;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }
        .canvas-container canvas, .canvas-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 4000px;
            height: 2000px;
            image-rendering: pixelated;
            pointer-events: none;
        }
        #editor-canvas {
            pointer-events: auto;
            z-index: 10;
        }
        #land-img { z-index: 1; }
        #elev-img { z-index: 2; opacity: 0.4; mix-blend-mode: multiply; }
        
        .status-bar {
            background: #34495e;
            padding: 5px 20px;
            font-size: 12px;
            text-align: right;
            border-top: 1px solid #1a252f;
        }
    </style>
</head>
<body class="mode-paint">

<header>
    <!-- 画像アップロード -->
    <div class="tool-group">
        <label>陸地:</label>
        <input type="file" id="upload-land" accept="image/*">
        <label>標高:</label>
        <input type="file" id="upload-elev" accept="image/*">
    </div>

    <!-- 操作モード（移動 vs ペイント） -->
    <div class="tool-group">
        <button id="btn-mode-paint" class="mode-btn active" onclick="setMode('paint')">🖊️ ペイントモード</button>
        <button id="btn-mode-move" class="mode-btn" onclick="setMode('move')">✋ 移動モード</button>
    </div>

    <!-- ペイントツール -->
    <div class="tool-group" id="paint-tools-sub">
        <button id="tool-pen" class="active" onclick="setTool('pen')">ペン</button>
        <button id="tool-eraser" onclick="setTool('eraser')">消しゴム</button>
        <button id="tool-fill" onclick="setTool('fill')">塗りつぶし</button>
        <button id="tool-clip" class="active" onclick="toggleClip()">クリップ: ON</button>
    </div>

    <!-- サイズ -->
    <div class="tool-group">
        <label>サイズ:</label>
        <input type="number" id="brush-size" value="5" min="1" max="100" style="width: 45px;">
    </div>

    <!-- 12色パレット + カスタム -->
    <div class="palette">
        <div class="color-dot selected" style="background:#ff0000;" onclick="selectPalette(this, '#ff0000')"></div>
        <div class="color-dot" style="background:#ff7f00;" onclick="selectPalette(this, '#ff7f00')"></div>
        <div class="color-dot" style="background:#ffff00;" onclick="selectPalette(this, '#ffff00')"></div>
        <div class="color-dot" style="background:#00ff00;" onclick="selectPalette(this, '#00ff00')"></div>
        <div class="color-dot" style="background:#00ffff;" onclick="selectPalette(this, '#00ffff')"></div>
        <div class="color-dot" style="background:#0000ff;" onclick="selectPalette(this, '#0000ff')"></div>
        <div class="color-dot" style="background:#7f00ff;" onclick="selectPalette(this, '#7f00ff')"></div>
        <div class="color-dot" style="background:#ff00ff;" onclick="selectPalette(this, '#ff00ff')"></div>
        <div class="color-dot" style="background:#8b4513;" onclick="selectPalette(this, '#8b4513')"></div>
        <div class="color-dot" style="background:#ffffff;" onclick="selectPalette(this, '#ffffff')"></div>
        <div class="color-dot" style="background:#7f7f7f;" onclick="selectPalette(this, '#7f7f7f')"></div>
        <div class="color-dot" style="background:#000000;" onclick="selectPalette(this, '#000000')"></div>
        <label style="margin-left:5px;">カスタム:</label>
        <input type="color" id="color-picker" value="#ff0000" onchange="onCustomColorChange(this.value)">
    </div>

    <button id="download-btn" onclick="downloadMap()">気候地図をダウンロード</button>
</header>

<!-- workspace全体をドラッグ移動の対象にする -->
<div class="workspace mode-paint" id="workspace">
    <div class="canvas-container">
        <img id="land-img" style="display:none;">
        <img id="elev-img" style="display:none;">
        <canvas id="editor-canvas" width="4000" height="2000"></canvas>
    </div>
</div>

<div class="status-bar" id="status-text">
    座標: (0, 0) | モード: ペイント (ペン)
</div>

<script>
    const canvas = document.getElementById('editor-canvas');
    const ctx = canvas.getContext('2d');
    const workspace = document.getElementById('workspace');
    const statusText = document.getElementById('status-text');
    const colorPicker = document.getElementById('color-picker');

    ctx.imageSmoothingEnabled = false;

    let appMode = 'paint'; // paint or move
    let currentTool = 'pen'; // pen, eraser, fill
    let isDrawing = false;
    let isClipping = true;
    let landImageData = null;

    // --- モード・ツール切り替え ---
    function setMode(mode) {
        appMode = mode;
        document.getElementById('btn-mode-paint').classList.remove('active');
        document.getElementById('btn-mode-move').classList.remove('active');
        workspace.classList.remove('mode-paint', 'mode-move');

        if (mode === 'paint') {
            document.getElementById('btn-mode-paint').classList.add('active');
            workspace.classList.add('mode-paint');
            document.getElementById('paint-tools-sub').style.opacity = "1";
            document.getElementById('paint-tools-sub').style.pointerEvents = "auto";
        } else {
            document.getElementById('btn-mode-move').classList.add('active');
            workspace.classList.add('mode-move');
            document.getElementById('paint-tools-sub').style.opacity = "0.5";
            document.getElementById('paint-tools-sub').style.pointerEvents = "none";
            isDrawing = false; // 強制終了
        }
        updateStatus();
    }

    function setTool(tool) {
        currentTool = tool;
        document.getElementById('tool-pen').classList.remove('active');
        document.getElementById('tool-eraser').classList.remove('active');
        document.getElementById('tool-fill').classList.remove('active');
        document.getElementById(`tool-${tool}`).classList.add('active');
        updateStatus();
    }

    function toggleClip() {
        isClipping = !isClipping;
        const btn = document.getElementById('tool-clip');
        btn.textContent = isClipping ? "クリップ: ON" : "クリップ: OFF";
        if(isClipping) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    // --- カラーパレット処理 ---
    function selectPalette(element, hexColor) {
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
        element.classList.add('selected');
        colorPicker.value = hexColor;
    }

    function onCustomColorChange(hexColor) {
        // カスタム色選択時は固定パレットの選択枠を外す
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
    }

    // --- 画像アップロード ---
    document.getElementById('upload-land').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.getElementById('land-img');
            img.src = event.target.result;
            img.style.display = 'block';
            img.onload = function() {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 4000;
                tempCanvas.height = 2000;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(img, 0, 0, 4000, 2000);
                landImageData = tempCtx.getImageData(0, 0, 4000, 2000).data;
            }
        }
        reader.readAsDataURL(file);
    });

    document.getElementById('upload-elev').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.getElementById('elev-img');
            img.src = event.target.result;
            img.style.display = 'block';
        }
        reader.readAsDataURL(file);
    });

    // --- 手のひら（移動）モードのスクロールロジック ---
    let isMoving = false;
    let startStartX, startStartY;
    let scrollLeft, scrollTop;

    workspace.addEventListener('mousedown', (e) => {
        if (appMode === 'move') {
            isMoving = true;
            startStartX = e.pageX - workspace.offsetLeft;
            startStartY = e.pageY - workspace.offsetTop;
            scrollLeft = workspace.scrollLeft;
            scrollTop = workspace.scrollTop;
        }
    });

    workspace.addEventListener('mousemove', (e) => {
        if (!isMoving || appMode !== 'move') return;
        e.preventDefault();
        const x = e.pageX - workspace.offsetLeft;
        const y = e.pageY - workspace.offsetTop;
        const walkX = (x - startStartX);
        const walkY = (y - startStartY);
        workspace.scrollLeft = scrollLeft - walkX;
        workspace.scrollTop = scrollTop - walkY;
    });

    const stopMoving = () => { isMoving = false; };
    workspace.addEventListener('mouseup', stopMoving);
    workspace.addEventListener('mouseleave', stopMoving);


    // --- ペイントモードのロジック ---
    let lastX = 0;
    let lastY = 0;

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
        return { x, y };
    }

    canvas.addEventListener('mousedown', (e) => {
        if (appMode !== 'paint') return;
        const pos = getMousePos(e);
        if (pos.x >= 3999) return; // 右端1pxガード

        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;

        if (currentTool === 'fill') {
            floodFill(pos.x, pos.y);
            syncRightEdge();
            isDrawing = false;
        } else {
            drawPixel(pos.x, pos.y);
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        const pos = getMousePos(e);
        
        // ステータス表示更新
        let toolName = currentTool === 'pen' ? 'ペン' : currentTool === 'eraser' ? '消しゴム' : '塗りつぶし';
        statusText.textContent = `座標: (${pos.x}, ${pos.y}) | モード: ${appMode === 'paint' ? 'ペイント ('+toolName+')' : '移動'}`;

        if (!isDrawing || appMode !== 'paint' || currentTool === 'fill') return;
        
        drawLine(lastX, lastY, pos.x, pos.y);
        lastX = pos.x;
        lastY = pos.y;
    });

    const stopDrawing = () => {
        if (isDrawing) {
            isDrawing = false;
            syncRightEdge();
        }
    };
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // クリップ判定
    function checkPixelClippable(x, y) {
        if (isClipping && landImageData) {
            const idx = (y * 4000 + x) * 4;
            return landImageData[idx + 3] === 0; // アルファ0ならクリップ（描画しない）
        }
        return false;
    }

    function drawPixel(x, y) {
        if (x >= 3999 || x < 0 || y < 0 || y >= 2000) return;

        const size = parseInt(document.getElementById('brush-size').value);
        const color = colorPicker.value;

        const half = Math.floor(size / 2);
        const startX = x - half;
        const startY = y - half;

        for (let dy = 0; dy < size; dy++) {
            for (let dx = 0; dx < size; dx++) {
                const px = startX + dx;
                const py = startY + dy;

                if (px >= 3999 || px < 0 || py < 0 || py >= 2000) continue;
                if (checkPixelClippable(px, py)) continue;

                if (currentTool === 'eraser') {
                    ctx.clearRect(px, py, 1, 1);
                } else {
                    ctx.fillStyle = color;
                    ctx.fillRect(px, py, 1, 1);
                }
            }
        }
        if (startX <= 0) syncRightEdge();
    }

    function drawLine(x0, y0, x1, y1) {
        const dx = Math.abs(x1 - x0);
        const dy = Math.abs(y1 - y0);
        const sx = (x0 < x1) ? 1 : -1;
        const sy = (y0 < y1) ? 1 : -1;
        let err = dx - dy;

        while (true) {
            drawPixel(x0, y0);
            if ((x0 === x1) && (y0 === y1)) break;
            const e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x0 += sx; }
            if (e2 < dx) { err += dx; y0 += sy; }
        }
    }

    // 右端同調
    function syncRightEdge() {
        const leftEdgeData = ctx.getImageData(0, 0, 1, 2000);
        ctx.putImageData(leftEdgeData, 3999, 0);
    }

    // 塗りつぶし
    function floodFill(startX, startY) {
        if (checkPixelClippable(startX, startY)) return;

        const colorHex = colorPicker.value;
        const targetR = parseInt(colorHex.substring(1,3), 16);
        const targetG = parseInt(colorHex.substring(3,5), 16);
        const targetB = parseInt(colorHex.substring(5,7), 16);
        const targetA = currentTool === 'eraser' ? 0 : 255;

        const imgData = ctx.getImageData(0, 0, 4000, 2000);
        const data = imgData.data;

        const startPos = (startY * 4000 + startX) * 4;
        const startR = data[startPos];
        const startG = data[startPos+1];
        const startB = data[startPos+2];
        const startA = data[startPos+3];

        if (startR === targetR && startG === targetG && startB === targetB && startA === targetA) return;

        const queue = [[startX, startY]];

        while (queue.length > 0) {
            const [x, y] = queue.pop();
            if (x < 0 || x >= 3999 || y < 0 || y >= 2000) continue;

            const idx = (y * 4000 + x) * 4;

            if (data[idx] === startR && data[idx+1] === startG && data[idx+2] === startB && data[idx+3] === startA) {
                if (isClipping && landImageData && landImageData[idx+3] === 0) continue;

                data[idx] = targetR;
                data[idx+1] = targetG;
                data[idx+2] = targetB;
                data[idx+3] = targetA;

                queue.push([x + 1, y]);
                queue.push([x - 1, y]);
                queue.push([x, y + 1]);
                queue.push([x, y - 1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function updateStatus() {
        let toolName = currentTool === 'pen' ? 'ペン' : currentTool === 'eraser' ? '消しゴム' : '塗りつぶし';
        statusText.textContent = `座標: (0, 0) | モード: ${appMode === 'paint' ? 'ペイント ('+toolName+')' : '移動'}`;
    }

    function downloadMap() {
        const link = document.createElement('a');
        link.download = 'climate_map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
