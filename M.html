<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>4000x2000 気候地図エディタ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #34495e;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #1a252f;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2c3e50;
            padding: 5px 10px;
            border-radius: 4px;
        }
        label { font-size: 12px; font-weight: bold; }
        input[type="file"] { font-size: 12px; width: 150px; }
        button {
            padding: 6px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2980b9; }
        button.active { background: #e67e22; }
        button.active:hover { background: #d35400; }
        #download-btn { background: #2ecc71; }
        #download-btn:hover { background: #27ae60; }
        
        .workspace {
            flex: 1;
            overflow: auto;
            position: relative;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }
        .canvas-container {
            position: relative;
            width: 4000px;
            height: 2000px;
            background: #7f8c8d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        /* 画像を重ね合わせるためのレイヤー構造 */
        .canvas-container canvas, .canvas-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 4000px;
            height: 2000px;
            image-rendering: pixelated; /* 拡大時もクッキリ表示 */
            pointer-events: none;
        }
        /* 最前面のエディタキャンバスのみマウスイベントを受け付ける */
        #editor-canvas {
            pointer-events: auto;
            z-index: 10;
        }
        #land-img { z-index: 1; mix-blend-mode: normal; }
        #elev-img { z-index: 2; opacity: 0.5; mix-blend-mode: multiply; } /* 標高は乗算で重ねる例 */
        
        .status-bar {
            background: #34495e;
            padding: 5px 20px;
            font-size: 12px;
            text-align: right;
            border-top: 1px solid #1a252f;
        }
    </style>
</head>
<body>

<header>
    <!-- 画像アップロード -->
    <div class="tool-group">
        <label>1. 陸地(海透明):</label>
        <input type="file" id="upload-land" accept="image/*">
    </div>
    <div class="tool-group">
        <label>2. 標高画像:</label>
        <input type="file" id="upload-elev" accept="image/*">
    </div>

    <!-- ツール選択 -->
    <div class="tool-group">
        <button id="tool-pen" class="active" onclick="setTool('pen')">ペン</button>
        <button id="tool-eraser" onclick="setTool('eraser')">消しゴム</button>
        <button id="tool-fill" onclick="setTool('fill')">塗りつぶし</button>
        <button id="tool-clip" onclick="toggleClip()">クリップ: OFF</button>
    </div>

    <!-- パラメータ -->
    <div class="tool-group">
        <label>色:</label>
        <input type="color" id="color-picker" value="#ff0000">
        <label>サイズ:</label>
        <input type="number" id="brush-size" value="5" min="1" max="100" style="width: 50px;">
    </div>

    <button id="download-btn" onclick="downloadMap()">気候地図をダウンロード</button>
</header>

<div class="workspace">
    <div class="canvas-container">
        <!-- 背景画像レイヤー -->
        <img id="land-img" style="display:none;">
        <img id="elev-img" style="display:none;">
        <!-- 描画用メインキャンバス -->
        <canvas id="editor-canvas" width="4000" height="2000"></canvas>
    </div>
</div>

<div class="status-bar" id="status-text">
    座標: (0, 0) | ツール: ペン
</div>

<script>
    const canvas = document.getElementById('editor-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');

    // 初期設定：アンチエイリアスを無効化
    ctx.imageSmoothingEnabled = false;

    let currentTool = 'pen'; // pen, eraser, fill
    let isDrawing = false;
    let isClipping = false; // クリップ機能フラグ（陸地画像がある場合のみ有効化可能）
    
    // 陸地判定用の隠しキャンバス（クリップ機能用）
    const landCanvas = document.createElement('canvas');
    landCanvas.width = 4000;
    landCanvas.height = 2000;
    const landCtx = landCanvas.getContext('2d');

    // 画像アップロード処理 (陸地)
    document.getElementById('upload-land').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.getElementById('land-img');
            img.src = event.target.result;
            img.style.display = 'block';
            img.onload = function() {
                // クリップ判定用に隠しキャンバスにも描画
                landCtx.clearRect(0, 0, 4000, 2000);
                landCtx.drawImage(img, 0, 0, 4000, 2000);
            }
        }
        reader.readAsDataURL(file);
    });

    // 画像アップロード処理 (標高)
    document.getElementById('upload-elev').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.getElementById('elev-img');
            img.src = event.target.result;
            img.style.display = 'block';
        }
        reader.readAsDataURL(file);
    });

    // ツール切り替え
    function setTool(tool) {
        currentTool = tool;
        document.getElementById('tool-pen').classList.remove('active');
        document.getElementById('tool-eraser').classList.remove('active');
        document.getElementById('tool-fill').classList.remove('active');
        document.getElementById(`tool-${tool}`).classList.add('active');
        updateStatus();
    }

    // クリップ機能のトグル
    function toggleClip() {
        isClipping = !isClipping;
        const btn = document.getElementById('tool-clip');
        if(isClipping) {
            btn.textContent = "クリップ: ON";
            btn.classList.add('active');
        } else {
            btn.textContent = "クリップ: OFF";
            btn.classList.remove('active');
        }
    }

    // マウスイベント登録
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    let lastX = 0;
    let lastY = 0;

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        // 表示サイズ(4000x2000)に対する実際のマウス位置を計算
        const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
        return { x, y };
    }

    function startDrawing(e) {
        const pos = getMousePos(e);
        // 右端1pxは保護領域のため描画開始できない
        if (pos.x >= 3999) return;

        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;

        if (currentTool === 'fill') {
            floodFill(pos.x, pos.y);
            syncRightEdge();
            isDrawing = false;
        } else {
            drawPixel(pos.x, pos.y);
        }
    }

    function draw(e) {
        const pos = getMousePos(e);
        statusText.textContent = `座標: (${pos.x}, ${pos.y}) | ツール: ${currentTool === 'pen' ? 'ペン' : currentTool === 'eraser' ? '消しゴム' : '塗りつぶし'}`;

        if (!isDrawing || currentTool === 'fill') return;
        
        // 直線をブレザナムアルゴリズム等で補間しつつ描画（アンチエイリアス無効のペン・消しゴム用）
        drawLine(lastX, lastY, pos.x, pos.y);
        
        lastX = pos.x;
        lastY = pos.y;
    }

    function stopDrawing() {
        if(isDrawing) {
            isDrawing = false;
            syncRightEdge(); // 描画終了時に最終同期
        }
    }

    // ピクセル描画の基盤（アンチエイリアス完全無効・クリップ対応）
    function drawPixel(x, y) {
        // 右端1pxには直接書き込めない
        if (x >= 3999 || x < 0 || y < 0 || y >= 2000) return;

        // クリップ機能が有効な場合、陸地キャンバスのアルファ値（透明度）をチェック
        if (isClipping) {
            const landAlpha = landCtx.getImageData(x, y, 1, 1).data[3];
            if (landAlpha === 0) return; // 海（透明）なら描画スキップ
        }

        const size = parseInt(document.getElementById('brush-size').value);
        const color = document.getElementById('color-picker').value;

        if (currentTool === 'eraser') {
            ctx.clearRect(x - Math.floor(size/2), y - Math.floor(size/2), size, size);
        } else {
            ctx.fillStyle = color;
            ctx.fillRect(x - Math.floor(size/2), y - Math.floor(size/2), size, size);
        }
        
        // 描画範囲が左端1pxにかすっている場合、即座に右端へ同期させる
        if (x - Math.floor(size/2) <= 0) {
            syncRightEdge();
        }
    }

    // ドットが飛ばないように線を繋ぐ処理
    function drawLine(x0, y0, x1, y1) {
        const dx = Math.abs(x1 - x0);
        const dy = Math.abs(y1 - y0);
        const sx = (x0 < x1) ? 1 : -1;
        const sy = (y0 < y1) ? 1 : -1;
        let err = dx - dy;

        while (true) {
            drawPixel(x0, y0);
            if ((x0 === x1) && (y0 === y1)) break;
            const e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x0 += sx; }
            if (e2 < dx) { err += dx; y0 += sy; }
        }
    }

    // 🌟超重要：左端の1pxを右端の1px(x=3999)にコピーする同期機能
    function syncRightEdge() {
        // 左端(x=0)の縦1列(幅1px、高さ2000px)を取得
        const leftEdgeData = ctx.getImageData(0, 0, 1, 2000);
        // 右端(x=3999)の縦1列に上書きコピー
        ctx.putImageData(leftEdgeData, 3999, 0);
    }

    // 塗りつぶし (Flood Fill) 機能
    function floodFill(startX, startY) {
        const colorHex = document.getElementById('color-picker').value;
        const targetR = parseInt(colorHex.substring(1,3), 16);
        const targetG = parseInt(colorHex.substring(3,5), 16);
        const targetB = parseInt(colorHex.substring(5,7), 16);
        const targetA = currentTool === 'eraser' ? 0 : 255;

        const imgData = ctx.getImageData(0, 0, 4000, 2000);
        const data = imgData.data;

        // クリックした場所の元の色を取得
        const startPos = (startY * 4000 + startX) * 4;
        const startR = data[startPos];
        const startG = data[startPos+1];
        const startB = data[startPos+2];
        const startA = data[startPos+3];

        // すでに同じ色なら処理しない
        if (startR === targetR && startG === targetG && startB === targetB && startA === targetA) return;

        // 陸地判定用のデータ
        let landData = null;
        if (isClipping) {
            landData = landCtx.getImageData(0, 0, 4000, 2000).data;
        }

        const queue = [[startX, startY]];

        while (queue.length > 0) {
            const [x, y] = queue.pop();
            if (x < 0 || x >= 3999 || y < 0 || y >= 2000) dangerouslyContinue; // 右端3999は保護するため侵入させない

            const idx = (y * 4000 + x) * 4;

            // 色が一致しているか確認
            if (data[idx] === startR && data[idx+1] === startG && data[idx+2] === startB && data[idx+3] === startA) {
                
                // クリップ機能チェック（海なら塗らない）
                if (isClipping && landData && landData[idx+3] === 0) {
                    continue; 
                }

                // 色を塗り替える
                data[idx] = targetR;
                data[idx+1] = targetG;
                data[idx+2] = targetB;
                data[idx+3] = targetA;

                // 4方向走査
                queue.push([x + 1, y]);
                queue.push([x - 1, y]);
                queue.push([x, y + 1]);
                queue.push([x, y - 1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    // ステータスバー表示更新
    function updateStatus() {
        statusText.textContent = `座標: (0, 0) | ツール: ${currentTool === 'pen' ? 'ペン' : currentTool === 'eraser' ? '消しゴム' : '塗りつぶし'}`;
    }

    // ダウンロード機能（描画した気候レイヤーのみを透過PNGで出力）
    function downloadMap() {
        const link = document.createElement('a');
        link.download = 'climate_map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
