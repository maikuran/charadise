<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>4000x2000 気候地図エディタ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #34495e;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #1a252f;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2c3e50;
            padding: 5px 10px;
            border-radius: 4px;
        }
        label { font-size: 12px; font-weight: bold; }
        input[type="file"] { font-size: 12px; width: 150px; }
        button {
            padding: 6px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2980b9; }
        button.active { background: #e67e22; }
        button.active:hover { background: #d35400; }
        #download-btn { background: #2ecc71; }
        #download-btn:hover { background: #27ae60; }
        
        .workspace {
            flex: 1;
            overflow: auto;
            position: relative;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }
        .canvas-container {
            position: relative;
            width: 4000px;
            height: 2000px;
            background: #34495e; /* 背景（海の部分の見え方） */
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        /* レイヤー構造 */
        .canvas-container canvas, .canvas-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 4000px;
            height: 2000px;
            image-rendering: pixelated;
            pointer-events: none;
        }
        /* 最前面のキャンバスのみ操作可能 */
        #editor-canvas {
            pointer-events: auto;
            z-index: 10;
        }
        #land-img { z-index: 1; }
        #elev-img { z-index: 2; opacity: 0.4; mix-blend-mode: multiply; }
        
        .status-bar {
            background: #34495e;
            padding: 5px 20px;
            font-size: 12px;
            text-align: right;
            border-top: 1px solid #1a252f;
        }
    </style>
</head>
<body>

<header>
    <div class="tool-group">
        <label>1. 陸地(海透明):</label>
        <input type="file" id="upload-land" accept="image/*">
    </div>
    <div class="tool-group">
        <label>2. 標高画像:</label>
        <input type="file" id="upload-elev" accept="image/*">
    </div>

    <div class="tool-group">
        <button id="tool-pen" class="active" onclick="setTool('pen')">ペン</button>
        <button id="tool-eraser" onclick="setTool('eraser')">消しゴム</button>
        <button id="tool-fill" onclick="setTool('fill')">塗りつぶし</button>
        <button id="tool-clip" class="active" onclick="toggleClip()">クリップ: ON</button>
    </div>

    <div class="tool-group">
        <label>色:</label>
        <input type="color" id="color-picker" value="#ff0000">
        <label>サイズ:</label>
        <input type="number" id="brush-size" value="5" min="1" max="100" style="width: 50px;">
    </div>

    <button id="download-btn" onclick="downloadMap()">気候地図をダウンロード</button>
</header>

<div class="workspace">
    <div class="canvas-container">
        <img id="land-img" style="display:none;">
        <img id="elev-img" style="display:none;">
        <canvas id="editor-canvas" width="4000" height="2000"></canvas>
    </div>
</div>

<div class="status-bar" id="status-text">
    座標: (0, 0) | ツール: ペン
</div>

<script>
    const canvas = document.getElementById('editor-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');

    ctx.imageSmoothingEnabled = false;

    let currentTool = 'pen';
    let isDrawing = false;
    let isClipping = true; // デフォルトでクリップON
    
    // クリップ判定用の陸地データ保持変数
    let landImageData = null;

    // 陸地画像アップロード
    document.getElementById('upload-land').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.getElementById('land-img');
            img.src = event.target.result;
            img.style.display = 'block';
            img.onload = function() {
                // クリップ（透明度判定）用にデータをメモリ上にロード
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 4000;
                tempCanvas.height = 2000;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(img, 0, 0, 4000, 2000);
                landImageData = tempCtx.getImageData(0, 0, 4000, 2000).data;
            }
        }
        reader.readAsDataURL(file);
    });

    // 標高画像アップロード
    document.getElementById('upload-elev').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.getElementById('elev-img');
            img.src = event.target.result;
            img.style.display = 'block';
        }
        reader.readAsDataURL(file);
    });

    function setTool(tool) {
        currentTool = tool;
        document.getElementById('tool-pen').classList.remove('active');
        document.getElementById('tool-eraser').classList.remove('active');
        document.getElementById('tool-fill').classList.remove('active');
        document.getElementById(`tool-${tool}`).classList.add('active');
        updateStatus();
    }

    function toggleClip() {
        isClipping = !isClipping;
        const btn = document.getElementById('tool-clip');
        if(isClipping) {
            btn.textContent = "クリップ: ON";
            btn.classList.add('active');
        } else {
            btn.textContent = "クリップ: OFF";
            btn.classList.remove('active');
        }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    let lastX = 0;
    let lastY = 0;

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
        return { x, y };
    }

    function startDrawing(e) {
        const pos = getMousePos(e);
        if (pos.x >= 3999) return; // 右端1pxは操作不可

        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;

        if (currentTool === 'fill') {
            floodFill(pos.x, pos.y);
            syncRightEdge();
            isDrawing = false;
        } else {
            drawPixel(pos.x, pos.y);
        }
    }

    function draw(e) {
        const pos = getMousePos(e);
        statusText.textContent = `座標: (${pos.x}, ${pos.y}) | ツール: ${currentTool === 'pen' ? 'ペン' : currentTool === 'eraser' ? '消しゴム' : '塗りつぶし'}`;

        if (!isDrawing || currentTool === 'fill') return;
        
        drawLine(lastX, lastY, pos.x, pos.y);
        
        lastX = pos.x;
        lastY = pos.y;
    }

    function stopDrawing() {
        if(isDrawing) {
            isDrawing = false;
            syncRightEdge();
        }
    }

    // 単一ピクセルの描画チェック（クリップ機能の核）
    function checkPixelClippable(x, y) {
        if (isClipping && landImageData) {
            const idx = (y * 4000 + x) * 4;
            const alpha = landImageData[idx + 3];
            if (alpha === 0) return true; // 透明部分なので描画をスキップ（クリップする）
        }
        return false;
    }

    function drawPixel(x, y) {
        if (x >= 3999 || x < 0 || y < 0 || y >= 2000) return;

        const size = parseInt(document.getElementById('brush-size').value);
        const color = document.getElementById('color-picker').value;

        // ブラシサイズに合わせて矩形を描画する際も、1ピクセルずつクリップ判定を行う
        const half = Math.floor(size / 2);
        const startX = x - half;
        const startY = y - half;

        for (let dy = 0; dy < size; dy++) {
            for (let dx = 0; dx < size; dx++) {
                const px = startX + dx;
                const py = startY + dy;

                if (px >= 3999 || px < 0 || py < 0 || py >= 2000) continue;
                if (checkPixelClippable(px, py)) continue; // ★透明なら乗せない

                if (currentTool === 'eraser') {
                    ctx.clearRect(px, py, 1, 1);
                } else {
                    ctx.fillStyle = color;
                    ctx.fillRect(px, py, 1, 1);
                }
            }
        }
        
        if (startX <= 0) {
            syncRightEdge();
        }
    }

    function drawLine(x0, y0, x1, y1) {
        const dx = Math.abs(x1 - x0);
        const dy = Math.abs(y1 - y0);
        const sx = (x0 < x1) ? 1 : -1;
        const sy = (y0 < y1) ? 1 : -1;
        let err = dx - dy;

        while (true) {
            drawPixel(x0, y0);
            if ((x0 === x1) && (y0 === y1)) break;
            const e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x0 += sx; }
            if (e2 < dx) { err += dx; y0 += sy; }
        }
    }

    // 右端1pxに左端1pxを完全同期
    function syncRightEdge() {
        const leftEdgeData = ctx.getImageData(0, 0, 1, 2000);
        ctx.putImageData(leftEdgeData, 3999, 0);
    }

    // 塗りつぶし (Flood Fill)
    function floodFill(startX, startY) {
        if (checkPixelClippable(startX, startY)) return; // クリックした場所がすでにクリップ対象なら何もしない

        const colorHex = document.getElementById('color-picker').value;
        const targetR = parseInt(colorHex.substring(1,3), 16);
        const targetG = parseInt(colorHex.substring(3,5), 16);
        const targetB = parseInt(colorHex.substring(5,7), 16);
        const targetA = currentTool === 'eraser' ? 0 : 255;

        const imgData = ctx.getImageData(0, 0, 4000, 2000);
        const data = imgData.data;

        const startPos = (startY * 4000 + startX) * 4;
        const startR = data[startPos];
        const startG = data[startPos+1];
        const startB = data[startPos+2];
        const startA = data[startPos+3];

        if (startR === targetR && startG === targetG && startB === targetB && startA === targetA) return;

        const queue = [[startX, startY]];

        while (queue.length > 0) {
            const [x, y] = queue.pop();
            if (x < 0 || x >= 3999 || y < 0 || y >= 2000) continue; 

            const idx = (y * 4000 + x) * 4;

            if (data[idx] === startR && data[idx+1] === startG && data[idx+2] === startB && data[idx+3] === startA) {
                
                // クリップ判定：陸地画像で透明(アルファが0)の場所なら塗りつぶしをスキップ
                if (isClipping && landImageData && landImageData[idx+3] === 0) {
                    continue; 
                }

                data[idx] = targetR;
                data[idx+1] = targetG;
                data[idx+2] = targetB;
                data[idx+3] = targetA;

                queue.push([x + 1, y]);
                queue.push([x - 1, y]);
                queue.push([x, y + 1]);
                queue.push([x, y - 1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function updateStatus() {
        statusText.textContent = `座標: (0, 0) | ツール: ${currentTool === 'pen' ? 'ペン' : currentTool === 'eraser' ? '消しゴム' : '塗りつぶし'}`;
    }

    function downloadMap() {
        const link = document.createElement('a');
        link.download = 'climate_map.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
