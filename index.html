<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Charadise - 無限の世界</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: #dff4ff;
    }

    /* Leafletのコントロールを全部非表示 */
    .leaflet-control-container {
      display: none;
    }

    /* タイル画像 */
    .infinite-world-tile {
      width: 2048px !important;
      height: 2048px !important;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: auto;
    }

    /* タイトル */
    .title {
      position: fixed;
      z-index: 9999;

      top: 18px;
      left: 20px;

      padding: 12px 18px;

      background: rgba(255, 255, 255, 0.88);

      border-radius: 16px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.12);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;

      pointer-events: none;
      user-select: none;
    }

    .title-main {
      font-size: 21px;
      font-weight: 700;
    }

    .title-sub {
      margin-top: 3px;

      font-size: 12px;

      opacity: 0.65;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="title">
    <div class="title-main">Charadise</div>
    <div class="title-sub">
      キャラたちの楽園 — 永遠の土地
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /*
     * ============================================================
     * Charadise
     * Infinite World
     * ============================================================
     *
     * 1枚の world.jpg を無限に繰り返す。
     *
     * 世界サイズ：
     *
     *     2048 × 2048
     *
     * ただし世界そのものには境界がない。
     *
     *          ← ← ← 無限 → → →
     *
     *          ↑
     *          ↑
     *        無限
     *          ↓
     *          ↓
     *
     * 同じ画像が上下左右に永遠に続く。
     *
     * ズーム：
     *     完全固定
     *
     * ピン：
     *     なし
     *
     * ============================================================
     */


    /*
     * ============================================================
     * 設定
     * ============================================================
     */

    const WORLD_IMAGE = "world.jpg";

    const WORLD_WIDTH = 2048;
    const WORLD_HEIGHT = 2048;


    /*
     * ============================================================
     * Leafletマップ
     * ============================================================
     */

    const map = L.map("map", {

      /*
       * 通常の地球地図ではなく
       * 無限平面として扱う。
       */
      crs: L.CRS.Simple,

      /*
       * 世界の中心。
       */
      center: [0, 0],

      /*
       * ズームは0だけ。
       */
      zoom: 0,

      minZoom: 0,
      maxZoom: 0,

      /*
       * ズームUIなし。
       */
      zoomControl: false,

      /*
       * ズーム操作をすべて無効化。
       */
      scrollWheelZoom: false,
      doubleClickZoom: false,
      touchZoom: false,
      boxZoom: false,
      keyboard: false,

      /*
       * 地図の境界を設定しない。
       *
       * これが重要。
       */
      maxBounds: null,

      /*
       * ドラッグ可能。
       */
      dragging: true,

      /*
       * Leafletによる通常の世界コピーは使用しない。
       *
       * 自前のInfiniteGridLayerで
       * 上下左右を無限化する。
       */
      worldCopyJump: false
    });


    /*
     * ============================================================
     * 無限タイルレイヤー
     * ============================================================
     *
     * world.jpgを1枚のタイルとして扱う。
     *
     * タイル番号：
     *
     *       (-2,-2) (-1,-2) (0,-2) (1,-2) (2,-2)
     *       (-2,-1) (-1,-1) (0,-1) (1,-1) (2,-1)
     *       (-2, 0) (-1, 0) (0, 0) (1, 0) (2, 0)
     *       (-2, 1) (-1, 1) (0, 1) (1, 1) (2, 1)
     *       (-2, 2) (-1, 2) (0, 2) (1, 2) (2, 2)
     *
     * これが無限に続く。
     */


    const InfiniteWorldLayer = L.GridLayer.extend({

      /*
       * 1タイル = 2048 × 2048
       */
      tileSize: L.point(
        WORLD_WIDTH,
        WORLD_HEIGHT
      ),

      /*
       * タイルの余白。
       */
      keepBuffer: 2,

      /*
       * 地図の端を作らない。
       */
      noWrap: true,

      /*
       * ズームは0のみ。
       */
      minZoom: 0,
      maxZoom: 0,

      /*
       * タイル作成。
       */
      createTile: function(coords, done) {

        const tile = document.createElement("img");

        tile.className = "infinite-world-tile";

        tile.width = WORLD_WIDTH;
        tile.height = WORLD_HEIGHT;

        tile.alt = "";

        tile.draggable = false;

        /*
         * 同じworld.jpgを
         * すべての座標に配置。
         */
        tile.src = WORLD_IMAGE;

        /*
         * 画像読み込み完了。
         */
        tile.onload = function() {
          done(null, tile);
        };

        /*
         * 読み込み失敗。
         */
        tile.onerror = function(error) {
          done(error, tile);
        };

        return tile;
      }
    });


    /*
     * ============================================================
     * Infinite Worldを追加
     * ============================================================
     */

    const infiniteWorld =
      new InfiniteWorldLayer();

    infiniteWorld.addTo(map);


    /*
     * ============================================================
     * 初期位置
     * ============================================================
     */

    map.setView(
      [0, 0],
      0,
      {
        animate: false
      }
    );


    /*
     * ============================================================
     * ズーム完全禁止
     * ============================================================
     */

    map.on("zoomstart", function() {
      if (map.getZoom() !== 0) {
        map.setZoom(0, {
          animate: false
        });
      }
    });

    map.on("zoom", function() {
      if (map.getZoom() !== 0) {
        map.setZoom(0, {
          animate: false
        });
      }
    });

    map.on("zoomend", function() {
      if (map.getZoom() !== 0) {
        map.setZoom(0, {
          animate: false
        });
      }
    });


    /*
     * ============================================================
     * マウスホイール完全無効化
     * ============================================================
     */

    const mapElement =
      document.getElementById("map");

    mapElement.addEventListener(
      "wheel",
      function(event) {
        event.preventDefault();
      },
      {
        passive: false
      }
    );


    /*
     * ============================================================
     * 右クリック無効化
     * ============================================================
     */

    mapElement.addEventListener(
      "contextmenu",
      function(event) {
        event.preventDefault();
      }
    );


    /*
     * ============================================================
     * ピンは一切使用しない
     * ============================================================
     *
     * L.marker()
     * L.circle()
     * L.circleMarker()
     *
     * は存在しない。
     */


    /*
     * ============================================================
     * Infinity
     * ============================================================
     *
     * LeafletのGridLayerが画面周辺に必要な
     * タイルを自動生成する。
     *
     * タイル座標に上限・下限を設けないため、
     *
     * X方向：
     *     ... -3 -2 -1 0 1 2 3 ...
     *
     * Y方向：
     *     ... -3 -2 -1 0 1 2 3 ...
     *
     * となる。
     *
     * 結果：
     *
     *             INFINITY
     *
     *                  ↑
     *
     *       ← ← ← WORLD → → →
     *
     *                  ↓
     *
     *             INFINITY
     *
     * ============================================================
     */
  </script>

</body>
</html>
