<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Charadise - 無限の世界</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    body {
        background: #dff4ff;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    /*
     * Leafletのコントロールを全部消す
     */
    .leaflet-control-container {
        display: none;
    }

    /*
     * タイルのサイズを256×256pxに固定
     */
    .leaflet-tile {
        width: 256px !important;
        height: 256px !important;
    }

    /*
     * タイトル
     */
    .title {
        position: fixed;
        z-index: 9999;

        top: 18px;
        left: 20px;

        padding: 12px 18px;

        border-radius: 16px;

        background: rgba(255, 255, 255, 0.88);

        box-shadow:
            0 5px 20px rgba(0, 0, 0, 0.12);

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Noto Sans JP",
            sans-serif;

        pointer-events: none;
        user-select: none;
    }

    .title-main {
        font-size: 21px;
        font-weight: 700;
    }

    .title-sub {
        margin-top: 3px;
        font-size: 12px;
        opacity: 0.65;
    }

    /*
     * 座標表示
     */
    .coordinates {
        position: fixed;
        z-index: 9999;

        top: 18px;
        right: 20px;

        min-width: 210px;

        padding: 11px 15px;

        border-radius: 14px;

        background: rgba(255, 255, 255, 0.88);

        box-shadow:
            0 5px 20px rgba(0, 0, 0, 0.12);

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Noto Sans JP",
            sans-serif;

        font-size: 13px;

        pointer-events: none;
        user-select: none;
    }

    .coordinate-title {
        font-size: 11px;
        opacity: 0.6;
        margin-bottom: 4px;
    }

    .coordinate-value {
        font-variant-numeric: tabular-nums;
        line-height: 1.5;
    }
</style>

</head>

<body>

<div id="map"></div>


<!-- =========================================================
     タイトル
========================================================= -->

<div class="title">

    <div class="title-main">
        Charadise
    </div>

    <div class="title-sub">
        キャラたちの楽園 — 永遠の土地
    </div>

</div>


<!-- =========================================================
     座標表示
========================================================= -->

<div class="coordinates">

    <div class="coordinate-title">
        WORLD COORDINATES
    </div>

    <div class="coordinate-value">
        X:
        <span id="coordinate-x">—</span>
    </div>

    <div class="coordinate-value">
        Y:
        <span id="coordinate-y">—</span>
    </div>

    <div class="coordinate-value">
        Tile:
        <span id="tile-x">—</span>,
        <span id="tile-y">—</span>
    </div>

    <div class="coordinate-value">
        Folder:
        <span id="folder-name">—</span>
    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/*
============================================================
    Charadise Infinite Tile World
============================================================

    1タイル
    = 256 × 256 px


    ========================================================
    フォルダ構造
    ========================================================

    16 × 16タイル
    = 256ファイル

    1つのフォルダに256ファイルを収納する。


    例：

    tiles/
    ├── 0_0/
    │   ├── 0_0.png
    │   ├── 1_0.png
    │   ├── ...
    │   └── 15_15.png
    │
    ├── 1_0/
    │   ├── 0_0.png
    │   ├── 1_0.png
    │   └── ...
    │
    ├── 0_1/
    │   └── ...
    │
    └── -1_0/
        └── ...


    フォルダ座標

    X方向：
        0～15     → フォルダ0
        16～31    → フォルダ1
        -1～-16   → フォルダ-1


    Y方向も同じ。


    例えば、

        X = 17
        Y = 3

    の場合、

        フォルダ：
        tiles/1_0/

        ファイル：
        1_3.png


    となる。


    世界の大きさに上限はない。
*/


/*
============================================================
    基本設定
============================================================
*/

const TILE_SIZE = 256;

/*
 * 1フォルダに16×16 = 256ファイル
 */
const CHUNK_SIZE = 16;


/*
============================================================
    Leaflet
============================================================
*/

const map = L.map("map", {

    /*
     * 地球ではなくXY平面
     */
    crs: L.CRS.Simple,

    /*
     * ズーム固定
     */
    zoom: 0,

    minZoom: 0,
    maxZoom: 0,

    /*
     * 初期位置
     *
     * 0_0タイルの中央
     */
    center: [128, 128],

    zoomControl: false,

    scrollWheelZoom: false,
    doubleClickZoom: false,
    touchZoom: false,
    boxZoom: false,
    keyboard: false,

    maxBounds: undefined,

    maxBoundsViscosity: 0
});


/*
============================================================
    座標処理
============================================================

    JavaScriptの % は負数で扱うと
    マイナスになるため、

    floor division

    を使って正しく処理する。
*/


/*
 * XまたはYのタイル番号から
 * チャンク番号を取得
 */
function getChunkCoordinate(tileCoordinate) {

    return Math.floor(
        tileCoordinate / CHUNK_SIZE
    );

}


/*
 * タイル番号から
 * フォルダ内でのローカル番号を取得
 */
function getLocalCoordinate(tileCoordinate) {

    return (
        ((tileCoordinate % CHUNK_SIZE) + CHUNK_SIZE)
        % CHUNK_SIZE
    );

}


/*
============================================================
    無限タイルレイヤー
============================================================
*/

const InfiniteWorldLayer =
    L.GridLayer.extend({

        /*
         * 1タイル256px
         */
        tileSize: TILE_SIZE,

        /*
         * 世界を横方向に繰り返さない
         */
        noWrap: true,

        /*
         * 範囲を指定しない
         */
        bounds: undefined,


        /*
         * タイル生成
         */
        createTile: function(coords, done) {

            /*
             * Leafletのタイル座標
             *
             * coords.x
             * coords.y
             */

            const x = coords.x;
            const y = coords.y;


            /*
             * このタイルが入るフォルダ
             */

            const chunkX =
                getChunkCoordinate(x);

            const chunkY =
                getChunkCoordinate(y);


            /*
             * フォルダ内でのファイル番号
             */

            const localX =
                getLocalCoordinate(x);

            const localY =
                getLocalCoordinate(y);


            /*
             * 画像要素
             */

            const tile =
                document.createElement("img");


            tile.width = TILE_SIZE;
            tile.height = TILE_SIZE;

            tile.alt = "";


            /*
             * ==================================================
             * ファイルパス
             * ==================================================
             *
             * 例：
             *
             * x = 17
             * y = 3
             *
             * → tiles/1_0/1_3.png
             *
             *
             * x = -1
             * y = 0
             *
             * → tiles/-1_0/15_0.png
             */

            tile.src =
                "./tiles/" +
                chunkX +
                "_" +
                chunkY +
                "/" +
                localX +
                "_" +
                localY +
                ".png";


            /*
             * 読み込み成功
             */

            tile.onload = function() {

                done(null, tile);

            };


            /*
             * ファイルが存在しない場合
             *
             * 空の水色タイルとして扱う。
             */

            tile.onerror = function() {

                const canvas =
                    document.createElement("canvas");

                canvas.width =
                    TILE_SIZE;

                canvas.height =
                    TILE_SIZE;


                const context =
                    canvas.getContext("2d");


                context.fillStyle =
                    "#dff4ff";


                context.fillRect(
                    0,
                    0,
                    TILE_SIZE,
                    TILE_SIZE
                );


                /*
                 * 空タイルを画像として表示
                 */

                tile.src =
                    canvas.toDataURL("image/png");


                tile.onload = function() {

                    done(null, tile);

                };

            };


            return tile;

        }

    });


/*
============================================================
    無限世界を追加
============================================================
*/

const world =
    new InfiniteWorldLayer();

world.addTo(map);


/*
============================================================
    座標表示要素
============================================================
*/

const coordinateX =
    document.getElementById(
        "coordinate-x"
    );


const coordinateY =
    document.getElementById(
        "coordinate-y"
    );


const tileX =
    document.getElementById(
        "tile-x"
    );


const tileY =
    document.getElementById(
        "tile-y"
    );


const folderName =
    document.getElementById(
        "folder-name"
    );


/*
============================================================
    マウス座標
============================================================
*/

map.on("mousemove", function(event) {

    /*
     * CRS.Simpleでは
     *
     * lng = X
     * lat = Y
     */

    const x =
        event.latlng.lng;

    const y =
        event.latlng.lat;


    /*
     * 世界座標
     *
     * 小数第2位まで表示
     */

    coordinateX.textContent =
        x.toFixed(2);

    coordinateY.textContent =
        y.toFixed(2);


    /*
     * 現在いるタイル
     */

    const currentTileX =
        Math.floor(
            x / TILE_SIZE
        );


    const currentTileY =
        Math.floor(
            y / TILE_SIZE
        );


    tileX.textContent =
        currentTileX;

    tileY.textContent =
        currentTileY;


    /*
     * 現在いるフォルダ
     */

    const currentChunkX =
        getChunkCoordinate(
            currentTileX
        );


    const currentChunkY =
        getChunkCoordinate(
            currentTileY
        );


    folderName.textContent =
        currentChunkX +
        "_" +
        currentChunkY;

});


/*
============================================================
    マウスが地図から出た場合
============================================================
*/

map.on("mouseout", function() {

    coordinateX.textContent = "—";

    coordinateY.textContent = "—";

    tileX.textContent = "—";

    tileY.textContent = "—";

    folderName.textContent = "—";

});


/*
============================================================
    初期位置
============================================================
*/

map.setView(
    [128, 128],
    0,
    {
        animate: false
    }
);


/*
============================================================
    ズーム完全禁止
============================================================
*/

map.on("zoomstart", function() {

    if (map.getZoom() !== 0) {

        map.setZoom(
            0,
            {
                animate: false
            }
        );

    }

});


map.on("zoomend", function() {

    if (map.getZoom() !== 0) {

        map.setZoom(
            0,
            {
                animate: false
            }
        );

    }

});


/*
============================================================
    ホイール操作禁止
============================================================
*/

const mapElement =
    document.getElementById("map");


mapElement.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/*
============================================================
    右クリックメニュー禁止
============================================================
*/

mapElement.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


/*
============================================================
    ピンなどは使用しない
============================================================

    L.marker()
    L.circleMarker()
    L.popup()

    などは使用していない。

    世界そのものをタイル画像で構成する。
*/

</script>

</body>
</html>
