<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正距方位図法 変換ツール</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { font-size: 1.5rem; }
    canvas { border: 1px solid #333; margin-top: 10px; background: white; }
    .controls { margin-bottom: 10px; }
    button { margin-right: 10px; padding: 6px 10px; }
  </style>
</head>
<body>
  <h1>正距方位図法（極中心）変換ツール</h1>

  <div class="controls">
    <input type="file" id="upload" accept="image/*" />
    <button onclick="render('north')">北極中心</button>
    <button onclick="render('south')">南極中心</button>
  </div>

  <canvas id="canvas" width="4000" height="4000"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let img = new Image();

    document.getElementById('upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function render(mode) {
      if (!img.src) return alert('画像をアップロードしてください');

      const w = canvas.width;
      const h = canvas.height;
      const output = ctx.createImageData(w, h);
      const inputCanvas = document.createElement('canvas');
      inputCanvas.width = w;
      inputCanvas.height = h;
      const ictx = inputCanvas.getContext('2d');
      ictx.drawImage(img, 0, 0, w, h);
      const inputData = ictx.getImageData(0, 0, w, h).data;

      const cx = w / 2;
      const cy = h / 2;
      const maxR = Math.min(cx, cy);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const dx = x - cx;
          const dy = y - cy;
          const r = Math.sqrt(dx*dx + dy*dy);

          if (r > maxR) continue;

          const theta = Math.atan2(dy, dx);
          let lat = (1 - r / maxR) * Math.PI / 2;
          if (mode === 'south') lat = -lat;
          const lon = theta;

          const srcX = Math.floor((lon + Math.PI) / (2 * Math.PI) * w);
          const srcY = Math.floor((Math.PI/2 - lat) / Math.PI * h);

          const srcIdx = (srcY * w + srcX) * 4;
          const dstIdx = (y * w + x) * 4;

          output.data[dstIdx] = inputData[srcIdx];
          output.data[dstIdx+1] = inputData[srcIdx+1];
          output.data[dstIdx+2] = inputData[srcIdx+2];
          output.data[dstIdx+3] = 255;
        }
      }

      ctx.putImageData(output, 0, 0);
    }
  </script>
</body>
</html>
